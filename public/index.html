<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kartomantik Online</title>
  <link rel="icon" type="image/webp" href="grimoire-icon.webp?v=20260905-1">

</head>
<body>

  <section id="joinScreen">
    <div class="tournament-create-launcher" id="tournamentCreateLauncher">
      <button type="button" class="tournament-launcher-toggle" id="tournamentToggleBtn" aria-expanded="false" aria-controls="tournamentLauncherOptions">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v5c0 3.2-2.1 5.7-5 6.4C9.1 14.7 7 12.2 7 9V4Z"/><path d="M7 7H4v2c0 2 1.4 3.5 3.5 3.8M17 7h3v2c0 2-1.4 3.5-3.5 3.8M12 15.5V20M8.5 20h7"/></svg>
        <span id="tournamentToggleLabel"></span>
      </button>
      <div class="tournament-launcher-options hidden" id="tournamentLauncherOptions" aria-hidden="true">
        <button class="tournament-create-action" id="createTournamentBtn">
          <strong id="createTournamentLabel"></strong>
          <span id="createTournamentHint"></span>
        </button>
        <label class="rules-beta-option" for="rulesBetaInput">
          <input type="checkbox" id="rulesBetaInput">
          <span><strong id="rulesBetaLabel"></strong><small id="rulesBetaHint"></small></span>
        </label>
        <div class="ban-list-launcher-row">
          <label class="rules-beta-option" for="banListInput">
            <input type="checkbox" id="banListInput">
            <span><strong id="banListToggleLabel"></strong><small id="banListToggleHint"></small></span>
          </label>
          <button type="button" id="editBanListBtn"></button>
        </div>
      </div>
    </div>
    <div class="join-hero">
      <img src="grimoire.webp?v=20260905-1" alt="" id="joinHero">
      <h1 id="appTitle"></h1>
    </div>
    <div class="join-card">
      <p class="tagline" id="tagline"></p>

      <div class="tabs">
        <button id="tabCreate" class="active"></button>
        <button id="tabJoin"></button>
      </div>

      <div id="createPane">
        <div class="field">
          <label id="nameLabel1"></label>
          <input id="createName" maxlength="30">
        </div>
        <button class="primary" id="createBtn"></button>

        <div class="codes-box hidden" id="codesBox">
          <div class="code-pill"><span id="playerCodeLabel"></span><div class="code-pill-row"><strong id="playerCodeValue"></strong><button data-copy="playerCodeValue" id="copyPlayerCode"></button></div></div>
          <div class="code-pill"><span id="observerCodeLabel"></span><div class="code-pill-row"><strong id="observerCodeValue"></strong><button data-copy="observerCodeValue" id="copyObserverCode"></button></div></div>
          <p class="share-hint" id="shareHint"></p>
          <button class="primary" id="continueBtn"></button>
        </div>
      </div>

      <div id="joinPane" class="hidden">
        <div class="field">
          <label id="nameLabel2"></label>
          <input id="joinName" maxlength="30">
        </div>
        <div class="field">
          <label id="codeLabel"></label>
          <input id="joinCode" maxlength="10" style="text-transform:uppercase">
        </div>
        <button class="primary" id="joinBtn"></button>
      </div>

      <p class="status-line" id="statusLine"></p>
    </div>
    <nav class="social-links">
      <button type="button" class="social-link-btn" id="languageBtn"></button>
      <a href="https://qw620istallri-png.github.io/DECKOMANTIK/" target="_blank" rel="noopener noreferrer" id="socialDeckomantik"></a>
      <a href="https://discord.gg/4YvXKyJ94p" target="_blank" rel="noopener noreferrer" id="socialDiscord"></a>
      <div class="social-instagram-wrap">
        <button type="button" class="social-link-btn" id="socialInstagram" aria-expanded="false" aria-controls="socialInstagramMenu"></button>
        <div class="social-instagram-menu hidden" id="socialInstagramMenu">
          <a href="https://www.instagram.com/kartomantik_cardgame/" target="_blank" rel="noopener noreferrer"><strong id="socialInstagramOfficialLabel"></strong><span>@kartomantik_cardgame</span></a>
          <a href="https://www.instagram.com/kartomantik_fan_france/" target="_blank" rel="noopener noreferrer"><strong id="socialInstagramFanLabel"></strong><span>@kartomantik_fan_france</span></a>
        </div>
      </div>
      <button type="button" class="social-link-btn" id="socialLegal"></button>
    </nav>
  </section>

  <section id="tournamentScreen" class="hidden">
    <header class="tournament-header">
      <div class="tournament-brand"><img src="grimoire-icon.webp?v=20260905-1" alt=""><div><strong id="tournamentTitle"></strong><span id="tournamentRoleLabel"></span></div></div>
      <div class="tournament-header-actions">
        <button type="button" id="tournamentLanguageBtn"></button>
        <button type="button" id="tournamentLeaveBtn"></button>
      </div>
    </header>
    <main class="tournament-shell">
      <section class="tournament-hero-panel">
        <div>
          <h1 id="tournamentMatchHeading"></h1>
        </div>
        <div class="tournament-state-badge" id="tournamentStateBadge"></div>
      </section>

      <section class="tournament-code-section" id="tournamentCodeSection">
        <div class="section-heading"><div><h2 id="tournamentAccessHeading"></h2></div></div>
        <div class="tournament-code-grid" id="tournamentCodeGrid"></div>
      </section>

      <div class="tournament-dashboard-grid">
        <section class="tournament-panel tournament-players-panel">
          <div class="section-heading compact"><div><h2 id="tournamentPlayersHeading"></h2></div></div>
          <div class="tournament-seats" id="tournamentSeats"></div>
          <div class="tournament-metrics" id="tournamentMetrics"></div>
          <div class="tournament-presence-list hidden" id="tournamentPresenceList"></div>
          <div class="tournament-audit-alerts" id="tournamentAuditAlerts"></div>
          <div class="tournament-actions" id="tournamentActions">
            <button id="tournamentViewMatchBtn"></button>
            <button class="primary organizer-only" id="tournamentStartBtn"></button>
            <button class="danger-button organizer-only" id="tournamentEndBtn"></button>
          </div>
          <details class="tournament-rules hidden" id="tournamentRulesPanel">
            <summary id="tournamentRulesSummary"></summary>
            <div class="tournament-rules-body">
              <label id="bannedCardsLabel"></label>
              <div class="tournament-rule-chips" id="bannedCardsList"></div>
              <div class="tournament-rule-add"><input id="bannedCardInput" list="tournamentCardOptions"><button id="bannedCardAddBtn"></button></div>
              <div class="restricted-groups" id="restrictedGroups"></div>
              <button id="restrictedGroupAddBtn"></button>
              <button class="primary" id="tournamentRulesSaveBtn"></button>
              <p class="tournament-rules-status" id="tournamentRulesStatus"></p>
            </div>
          </details>
        </section>

        <section class="tournament-panel tournament-log-panel">
          <div class="section-heading compact tournament-log-heading"><div><h2 id="tournamentLogHeading"></h2></div><button id="tournamentExportLogBtn"></button></div>
          <div class="tournament-log" id="tournamentLiveLog"></div>
        </section>
      </div>
    </main>
  </section>
  <datalist id="tournamentCardOptions"></datalist>

  <div class="log-panel hidden" id="homePolicyPanel">
    <div class="box tournament-rules-body">
      <div class="log-toolbar"><h2 id="homePolicyHeading"></h2><button id="homePolicyCloseBtn">×</button></div>
      <label id="homeBannedCardsLabel"></label>
      <div class="tournament-rule-chips" id="homeBannedCardsList"></div>
      <div class="tournament-rule-add"><input id="homeBannedCardInput" list="tournamentCardOptions"><button id="homeBannedCardAddBtn"></button></div>
      <div class="restricted-groups" id="homeRestrictedGroups"></div>
      <button id="homeRestrictedGroupAddBtn"></button>
      <button class="primary" id="homePolicyDoneBtn"></button>
    </div>
  </div>

  <section id="gameScreen" class="hidden">
    <div class="game-header-hot-zone" id="gameHeaderHotZone" aria-hidden="true"></div>
    <header class="game-header">
      <div class="brand" id="brandLabel"><strong class="phase-turn-counter hidden" id="phaseTurn"></strong><img src="grimoire-icon.webp?v=20260905-1" alt="" id="brandLogo"><span id="brandText"></span></div>
      <div class="header-center">
        <div class="codes" id="headerCodes"></div>
        <div class="header-view-toggles">
          <button id="hideCodesBtn" title=""></button>
          <button id="hideInterfaceBtn" title=""></button>
          <button type="button" id="rarityEffectsToggleBtn" aria-pressed="false"></button>
          <button type="button" id="gameLanguageBtn"></button>
          <button type="button" id="fullscreenBtn"></button>
        </div>
      </div>
      <div class="actions">
        <div class="header-action-group">
          <button type="button" class="hidden" id="judgeReturnBtn"></button>
          <button id="importDeckBtn"></button>
          <button id="downloadLogBtn"></button>
          <details class="game-more-menu" id="gameMoreMenu">
            <summary><span id="gameMoreLabel"></span></summary>
            <div class="game-more-popover">
              <span class="phase-header-control" id="phaseHeaderControl">
                <button type="button" id="phaseTrackerBtn"></button>
                <button type="button" id="phaseAdvancedBtn">
                  <span id="phaseAdvancedLabel"></span>
                  <span class="phase-mode-switch" aria-hidden="true"><span></span></span>
                </button>
              </span>
              <button id="currentSideboardBtn" class="hidden"></button>
              <button id="resetBoardBtn" class="hidden"></button>
              <button id="endSessionBtn"></button>
              <button id="leaveSessionBtn" class="hidden"></button>
            </div>
          </details>
        </div>
      </div>
    </header>
    <p class="status-line" id="gameStatusLine"></p>
    <div class="tournament-waiting-banner hidden" id="tournamentWaitingBanner"></div>
    <div class="session-ended-banner hidden" id="sessionEndedBanner"></div>
    <div class="board-field-wrap" id="battlefieldWrap">
      <section class="rules-pregame-panel hidden" id="rulesPregamePanel" aria-labelledby="rulesPregameTitle" aria-live="polite">
        <div class="rules-pregame-copy">
          <span id="rulesPregameTurn"></span>
          <h2 id="rulesPregameTitle"></h2>
          <p id="rulesPregameHint"></p>
        </div>
        <div class="rules-pregame-players" id="rulesPregamePlayers"></div>
        <div class="rules-pregame-actions" id="rulesPregameActions">
          <button type="button" id="rulesOpeningHandBtn"></button>
          <button type="button" id="rulesPregameMulliganBtn"></button>
          <button type="button" class="primary" id="rulesPregameReadyBtn"></button>
        </div>
      </section>
      <section class="phase-tracker hidden" id="phaseTracker">
        <div class="phase-sequence" id="phaseSequence"></div>
        <div class="phase-current-label" id="phaseCurrentLabel">
          <strong id="phaseCurrentMain"></strong>
          <span id="phaseCurrentStep"></span>
        </div>
        <span class="rules-confrontation-summary hidden" id="rulesConfrontationSummary" aria-live="polite"></span>
        <span class="rules-priority" id="rulesPriority" aria-live="polite"></span>
        <button type="button" class="phase-pass-button primary" id="passPriorityBtn"></button>
        <div class="rules-turn-context hidden" id="rulesTurnContext"></div>
      </section>
      <section class="rules-stack-panel hidden" id="rulesStackPanel" aria-labelledby="rulesStackTitle">
        <div class="rules-turn-rail">
          <div class="rules-stack-status">
            <span class="rules-stack-title" id="rulesStackTitle"></span>
          </div>
        </div>
        <div class="rules-stack-body hidden" id="rulesStackBody" aria-live="polite">
          <ol class="rules-stack-list" id="rulesStackList"></ol>
        </div>
        <p class="rules-stack-hint hidden" id="rulesStackHint"></p>
      </section>
      <section class="rules-board-flow hidden" id="rulesBoardFlow" aria-live="polite">
        <svg class="rules-target-arrow" id="rulesTargetArrow" aria-hidden="true">
          <defs><marker id="rulesTargetArrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"></path></marker></defs>
          <path class="rules-target-arrow-line" marker-end="url(#rulesTargetArrowHead)"></path>
        </svg>
        <div class="rules-board-essence hidden" id="rulesBoardEssence"></div>
        <div class="rules-floating-card" id="rulesFloatingCard">
          <button type="button" class="rules-flow-cancel" id="rulesFlowCancelBtn" aria-label="Cancel">×</button>
          <img id="rulesFloatingCardImg" alt="">
          <div class="rules-floating-copy">
            <strong id="rulesFloatingCardName"></strong>
            <span id="rulesFlowInstruction"></span>
            <div class="rules-flow-cost" id="rulesFlowCost"></div>
            <div class="rules-flow-choice-actions hidden" id="rulesFlowChoiceActions">
              <button type="button" id="rulesFlowDeclineBtn"></button>
              <button type="button" class="primary" id="rulesFlowPayBtn"></button>
            </div>
          </div>
        </div>
      </section>
      <div class="top-left-stack" id="topLeftStack">
        <div class="opp-rows" id="oppRows"></div>
        <div class="chat-panel" id="chatPanel">
          <div class="chat-header">
            <span id="chatHeading"></span>
            <div class="chat-header-actions">
              <button id="chatCloseBtn" title="Close">×</button>
            </div>
          </div>
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-input-row">
            <input id="chatInput" maxlength="500">
            <button id="chatSendBtn"></button>
          </div>
        </div>
        <button class="chat-reopen-btn hidden" id="chatReopenBtn" title="Chat">💬</button>
      </div>
      <div class="hand-view-panel hidden" id="handViewPanel">
        <button class="hand-view-close" id="handViewCloseBtn">✕</button>
        <div class="hand-view-title" id="handViewTitle"></div>
        <div class="hand-view-cards" id="handViewCards"></div>
        <div class="hand-view-resize-handle" id="handViewResizeHandle"></div>
      </div>
      <div class="side-toolbars" id="sideToolbars">
        <div class="draw-toolbar" id="drawToolbar">
          <button id="drawPenBtn" title="Draw">✏️</button>
          <button id="drawEraseBtn" title="Erase area">⬚</button>
          <div class="draw-sep"></div>
          <button id="drawUndoBtn" title="Undo">↩</button>
          <button id="drawRedoBtn" title="Redo">↪</button>
          <div class="draw-sep"></div>
          <button id="drawClearBtn" title="Clear my drawings">🗑</button>
        </div>
        <div class="token-toolbar" id="tokenToolbar">
          <button id="createTokenBtn" title="Create a token card">🃏+</button>
          <button id="createEssenceBtn" title="Create essence"></button>
          <button id="createDiceBtn" title="Roll dice">🎲</button>
        </div>
        <div class="view-toolbar" id="viewToolbar">
          <button id="highlightOwnersBtn" title="Highlight cards by owner color">🎨</button>
          <button id="inspectReopenBtn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></svg>
          </button>
        </div>
      </div>
      <div class="board-tools-topright" id="boardToolsTopRight">
        <div class="zoom-controls">
          <button id="zoomOutBtn">−</button>
          <button id="zoomResetBtn">100%</button>
          <button id="zoomInBtn">+</button>
        </div>
        <div class="zoom-controls">
          <button id="pileCalibrateBtn"></button>
        </div>
      </div>
      <div class="opponent-hand-fan" id="opponentHandFan" aria-live="polite"></div>
      <div class="battlefield" id="battlefield">
        <div class="battlefield-bg" id="battlefieldBg"></div>
        <svg class="rules-effect-layer" id="rulesEffectLayer" viewBox="0 0 1741 1549" aria-hidden="true"></svg>
        <svg class="draw-layer" id="drawLayer"></svg>
      </div>
      <div class="hand-area" id="handArea">
        <div class="hand-tools-dock" id="handToolsDock">
          <div class="hand-tools-row">
            <button type="button" class="hand-tools-toggle" id="handToolsToggleBtn" aria-expanded="false" aria-controls="handToolbar">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="11" height="14" rx="2"/><path d="m9 6 2-2h7a2 2 0 0 1 2 2v10l-5 4"/><path d="M7.5 10h4M7.5 13h4M7.5 16h2.5"/></svg>
              <span id="handToolsToggleLabel"></span>
            </button>
            <button type="button" class="hand-visibility-toggle" id="handVisibilityBtn" aria-pressed="false"></button>
            <div class="hand-essence-strip hidden" id="handEssenceStrip" role="status"></div>
          </div>
          <div class="hand-toolbar hidden" id="handToolbar">
            <button class="hand-tool-btn" id="handDrawOneBtn"></button>
            <button class="hand-tool-btn" id="handDrawHandBtn"></button>
            <span class="hand-tool-btn hand-card-count" id="handCardCount"></span>
            <div class="hand-tool-sep"></div>
            <button class="hand-tool-btn" id="handDiscardBtn"></button>
            <button class="hand-tool-btn" id="handDiscardRandomBtn"></button>
            <div class="hand-tool-sep"></div>
            <button class="hand-tool-btn" id="handShowBtn"></button>
            <div class="hand-tool-sep"></div>
            <button class="hand-tool-btn" id="handMulliganBtn"></button>
            <span class="hint hand-tool-btn hidden" id="handPickHint"></span>
          </div>
        </div>
        <div class="hand-resize-handle" id="handResizeHandle"></div>
        <div class="hand-tray" id="myHandTray"></div>
      </div>
    </div>
  </section>

  <div class="log-panel hidden" id="importPanel">
    <div class="box">
      <h2 id="importDeckHeading"></h2>
      <a href="https://qw620istallri-png.github.io/DECKOMANTIK/" target="_blank" rel="noopener noreferrer" class="deckomantik-link" id="deckomantikLink">DeckomantiK ↗</a>

      <h3 id="starterDecksHeading" class="import-subhead"></h3>
      <div id="starterDeckList" class="deck-pick-list"></div>

      <h3 id="savedDecksHeading" class="import-subhead"></h3>
      <div id="savedDeckList" class="deck-pick-list"></div>

      <h3 id="currentDeckHeading" class="import-subhead"></h3>
      <div id="currentDeckSummary" class="current-deck-summary"></div>

      <p id="importDeckHintText" style="color:var(--muted);font-size:14px"></p>
      <div class="import-paste-frame">
        <textarea id="importDeckText" rows="10"></textarea>
        <button type="button" id="importPasteBtn"></button>
      </div>
      <p id="importSelectionStatus" class="import-selection-status" aria-live="polite"></p>
      <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end">
        <button id="importCancelBtn"></button>
        <button id="importSideboardBtn" disabled></button>
        <button class="primary" id="importConfirmBtn"></button>
      </div>
    </div>
  </div>

  <div class="log-panel sideboard-panel hidden" id="sideboardPanel">
    <div class="box">
      <div class="sideboard-editor-head">
        <div><span class="eyebrow">DeckomantiK</span><h2 id="sideboardEditorHeading"></h2></div>
        <button id="sideboardCancelBtn" aria-label="Close">×</button>
      </div>
      <p id="sideboardEditorHint" class="sideboard-editor-hint"></p>
      <p id="sideboardResetWarning" class="sideboard-reset-warning hidden"></p>
      <div class="sideboard-editor-grid">
        <section class="sideboard-pool">
          <header><h3 id="sideboardDeckHeading"></h3><div id="sideboardDeckStats" class="sideboard-stats"></div></header>
          <div id="sideboardDeckCards" class="sideboard-cards"></div>
        </section>
        <section class="sideboard-pool">
          <header><h3 id="sideboardPoolHeading"></h3><div id="sideboardPoolStats" class="sideboard-stats"></div></header>
          <div id="sideboardPoolCards" class="sideboard-cards"></div>
        </section>
      </div>
      <div class="sideboard-editor-footer">
        <p id="sideboardValidationMessage" aria-live="polite"></p>
        <button class="primary" id="sideboardValidateBtn"></button>
      </div>
    </div>
  </div>

  <div class="log-panel hidden" id="logPanel">
    <div class="box">
      <div class="log-toolbar">
        <h2 id="logHeading"></h2>
        <div style="display:flex;gap:8px">
          <button id="logDownloadBtn"></button>
          <button id="logCloseBtn"></button>
        </div>
      </div>
      <div id="logEntries"></div>
    </div>
  </div>

  <div class="log-panel hidden" id="playerLogPanel">
    <div class="box">
      <div class="log-toolbar">
        <h2 id="playerLogHeading"></h2>
        <button id="playerLogCloseBtn"></button>
      </div>
      <div id="playerLogEntries"></div>
    </div>
  </div>

  <div class="log-panel reveal-panel hidden" id="revealPanel">
    <div class="box">
      <h2 id="revealHeading"></h2>
      <p class="reveal-who" id="revealWho"></p>
      <div class="reveal-cards" id="revealCards"></div>
      <div class="reveal-resize-handle" id="revealResizeHandle"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:16px">
        <button id="revealCloseBtn"></button>
      </div>
    </div>
  </div>

  <div class="log-panel inspect-panel hidden" id="inspectPanel">
    <div class="box">
      <div class="inspect-main">
        <div class="inspect-img"><img id="inspectImg" alt=""></div>
        <div class="inspect-text">
          <h2 id="inspectName"></h2>
          <div class="meta" id="inspectMeta"></div>
          <div class="effect" id="inspectEffect"></div>
          <div style="display:flex;justify-content:flex-end;margin-top:14px">
            <button id="inspectCloseBtn"></button>
          </div>
        </div>
      </div>
      <div class="inspect-history" id="inspectHistory"></div>
      <div class="inspect-resize-handle" id="inspectResizeHandle"></div>
    </div>
  </div>

  <div class="log-panel token-panel hidden" id="tokenPanel">
    <div class="box">
      <h2 id="tokenPanelHeading"></h2>
      <p id="tokenPanelHint" style="color:var(--muted);font-size:14px"></p>
      <div class="token-temperament-grid" id="tokenTemperamentGrid"></div>
      <div class="field">
        <label id="tokenPowerLabel"></label>
        <div class="number-stepper">
          <button type="button" class="stepper-btn" data-step="-1" data-target="tokenPowerInput">−</button>
          <input id="tokenPowerInput" type="number" value="1" min="-20" max="20">
          <button type="button" class="stepper-btn" data-step="1" data-target="tokenPowerInput">+</button>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end">
        <button id="tokenCancelBtn"></button>
        <button class="primary" id="tokenCreateBtn"></button>
      </div>
    </div>
  </div>

  <div class="log-panel token-panel hidden" id="essencePanel">
    <div class="box">
      <h2 id="essencePanelHeading"></h2>
      <p id="essencePanelHint" style="color:var(--muted);font-size:14px"></p>
      <div class="token-temperament-grid" id="essenceTemperamentGrid"></div>
      <div class="field hidden" id="neutralTokenNameField">
        <label id="neutralTokenNameLabel" for="neutralTokenNameInput"></label>
        <input id="neutralTokenNameInput" maxlength="40">
      </div>
      <div class="field">
        <label id="essenceCountLabel"></label>
        <div class="number-stepper">
          <button type="button" class="stepper-btn" data-step="-1" data-target="essenceCountInput">−</button>
          <input id="essenceCountInput" type="number" value="1" min="-99" max="99">
          <button type="button" class="stepper-btn" data-step="1" data-target="essenceCountInput">+</button>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end">
        <button id="essenceCancelBtn"></button>
        <button class="primary" id="essenceCreateBtn"></button>
      </div>
    </div>
  </div>

  <div class="log-panel dice-panel hidden" id="dicePanel">
    <div class="box">
      <div id="diceConfigView">
        <h2 id="dicePanelHeading"></h2>
        <div class="dice-mode-grid" id="diceModeGrid">
          <button data-dice-mode="d6"></button>
          <button data-dice-mode="coin"></button>
        </div>
        <div class="field">
          <label id="diceCountLabel"></label>
          <div class="number-stepper">
            <button type="button" class="stepper-btn" data-step="-1" data-target="diceCountInput">−</button>
            <input id="diceCountInput" type="number" value="1" min="1" max="20">
            <button type="button" class="stepper-btn" data-step="1" data-target="diceCountInput">+</button>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end">
          <button id="diceCancelBtn"></button>
          <button class="primary" id="diceRollBtn"></button>
        </div>
      </div>
      <div id="diceResultView" class="hidden">
        <h2 id="diceResultHeading"></h2>
        <div class="dice-result-display" id="diceResultDisplay"></div>
        <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
          <button id="diceResultCloseBtn"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="log-panel confirm-panel hidden" id="confirmPanel">
    <div class="box">
      <p id="confirmPanelText"></p>
      <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
        <button id="confirmPanelCancelBtn"></button>
        <button class="primary" id="confirmPanelOkBtn"></button>
      </div>
    </div>
  </div>

  <div class="log-panel deck-browser-panel hidden" id="deckBrowserPanel">
    <div class="box">
      <div class="deck-browser-head">
        <h2 id="deckBrowserHeading"></h2>
        <div class="deck-browser-slider-group">
          <label id="deckBrowserSliderLabel" for="deckBrowserSlider"></label>
          <input type="range" id="deckBrowserSlider" min="80" max="300" value="140">
        </div>
        <button id="deckBrowserCloseBtn"></button>
      </div>
      <div class="deck-browser-cards" id="deckBrowserCards"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:10px">
        <button class="primary" id="deckBrowserValidateBtn"></button>
      </div>
    </div>
  </div>

  <div class="log-panel hidden" id="legalPanel">
    <div class="box">
      <h2 id="legalHeading"></h2>
      <div class="legal-copy" id="legalCopy"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:14px">
        <button id="legalCloseBtn"></button>
      </div>
    </div>
  </div>

  <div class="log-panel hand-request-panel hidden" id="handRequestPanel">
    <div class="box">
      <h2 id="handRequestHeading"></h2>
      <p id="handRequestText"></p>
      <div class="hand-request-card" id="handRequestCard"></div>
      <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
        <button id="handRequestDeclineBtn"></button>
        <button class="primary" id="handRequestAcceptBtn"></button>
      </div>
    </div>
  </div>

  <div class="log-panel rules-choice-panel hidden" id="rulesChoicePanel" role="dialog" aria-modal="true" aria-labelledby="rulesChoiceHeading">
    <div class="box">
      <div class="rules-choice-head">
        <h2 id="rulesChoiceHeading"></h2>
        <button type="button" id="rulesChoiceCloseBtn" aria-label="Close">×</button>
      </div>
      <p id="rulesChoiceText"></p>
      <div class="rules-choice-options" id="rulesChoiceOptions"></div>
    </div>
  </div>

  <div class="log-panel rules-action-declare-panel hidden" id="rulesActionPanel" role="dialog" aria-modal="true" aria-labelledby="rulesActionHeading">
    <div class="box">
      <div class="rules-action-head">
        <h2 id="rulesActionHeading"></h2>
        <button type="button" id="rulesActionCloseBtn" aria-label="Close">×</button>
      </div>
      <div class="rules-action-source">
        <img id="rulesActionSourceImg" alt="">
        <div>
          <strong id="rulesActionSourceName"></strong>
          <span id="rulesActionSourceMeta"></span>
          <p id="rulesActionSourceEffect"></p>
        </div>
      </div>
      <form id="rulesActionDeclareForm">
        <div class="rules-action-fields">
          <label><span id="rulesActionKindLabel"></span><select id="rulesActionKind"></select></label>
          <label><span id="rulesActionDescriptionLabel"></span><input id="rulesActionDescription" maxlength="160"></label>
          <label><span id="rulesActionTargetLabel"></span><input id="rulesActionTarget" maxlength="240"></label>
          <label><span id="rulesActionCostLabel"></span><input id="rulesActionCostNote" maxlength="240"></label>
        </div>
        <fieldset class="rules-target-fieldset">
          <legend id="rulesTargetLegend"></legend>
          <p id="rulesTargetHint"></p>
          <div class="rules-target-list" id="rulesTargetList"></div>
        </fieldset>
        <fieldset class="rules-tribute-fieldset">
          <legend id="rulesTributeLegend"></legend>
          <p id="rulesTributeHint"></p>
          <div class="rules-tribute-summary hidden" id="rulesTributeSummary"></div>
          <div class="rules-tribute-list" id="rulesTributeList"></div>
        </fieldset>
        <p class="rules-action-warning" id="rulesActionWarning"></p>
        <div class="rules-action-footer">
          <button type="button" id="rulesActionCancelBtn"></button>
          <button type="submit" class="primary" id="rulesActionDeclareBtn"></button>
        </div>
      </form>
    </div>
  </div>

  <div class="tournament-player-alert hidden" id="tournamentPlayerAlert" role="alert" aria-live="assertive">
    <strong id="tournamentPlayerAlertTitle"></strong>
    <p id="tournamentPlayerAlertText"></p>
  </div>

  <script src="i18n.js?v=20261010-rules-beta-112"></script>
  <script src="app.js?v=20261010-rules-beta-112"></script>
</body>
</html>
